<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-zh="Casarte Design | 选择器" data-i18n-en="Casarte Design | Selectors">Casarte Design | 选择器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #0D0D0F;
            --panel-bg: rgba(22, 22, 26, 0.75);
            --border-gray: rgba(255, 255, 255, 0.1);
            --text-gold: #E9BD85;
            --brand-red: #FF3B30;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: #F5F5F7;
            overflow-x: hidden;
        }

        .ambient-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 0%, #1E1812 0%, #0D0D0F 70%);
        }

        .gallery-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-gray);
            border-radius: 0;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #2A2A30; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-gold); }
    </style>
</head>

<body class="antialiased">
    <div class="ambient-bg"></div>

    <!-- 移动端 Header -->
    <header class="md:hidden gallery-panel rounded-none fixed top-0 w-full z-50 p-4 flex justify-between items-center border-b border-amber-900/30">
        <div class="flex items-center">
            <div class="w-8 h-8 mr-2 bg-[#E9BD85] text-black flex items-center justify-center font-bold text-sm">C</div>
            <h1 class="font-bold text-base text-white tracking-widest" data-i18n-zh="选择器 SELECTOR" data-i18n-en="SELECTOR">选择器</h1>
        </div>
        <button id="mobile-menu-btn" class="p-2 bg-white/5 hover:bg-white/10 rounded-lg text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </header>

    <div class="flex h-screen pt-16 md:pt-0">
        <!-- 侧边栏导航（自动适配，与按钮页完全一致） -->
        <aside id="sidebar" class="hidden md:flex flex-col w-72 h-full fixed top-0 left-0 gallery-panel rounded-none border-r border-gray-800 z-40 overflow-y-auto" aria-label="Casarte OS 设计规范导航" aria-hidden="true"></aside>
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-30 hidden md:hidden" aria-hidden="true"></div>

        <!-- 主内容区 -->
        <main class="flex-1 md:ml-72 p-6 md:p-12 lg:p-16 overflow-y-auto h-full scroll-smooth" id="main-content">
            <div class="max-w-[1360px] mx-auto pb-32 space-y-20">
                
                <!-- 返回主页按钮 -->
                <div class="hidden md:flex items-center mb-8">
                    <a href="haier_os_design_system.html" class="px-5 py-2.5 bg-white/15 hover:bg-white/25 transition-colors flex items-center text-white border border-white/20 rounded-none">
                        <span class="text-sm font-medium tracking-wide" data-i18n-zh="返回主页" data-i18n-en="Home">返回主页</span>
                    </a>
                </div>

                <!-- 大标题与说明 -->
                <section class="border-b border-gray-800 pb-8">
                    <h1 class="text-4xl md:text-6xl font-bold tracking-tight text-white mb-6" data-i18n-zh="选择器" data-i18n-en="SELECTOR">选择器</h1>
                    <p class="text-base md:text-lg text-gray-300 max-w-4xl leading-relaxed" data-i18n-zh="选择器（Selector）用于收纳与整理大量备选项的信息录入类组件。在卡萨帝高端家电交互体系中，选择器通过清晰的层次结构、明确的触摸热区以及深浅双色模式的无缝适配，保障全场景下的快速精准选择。" data-i18n-en="The Selector component accommodates and manages large sets of input options. In the Casarte design ecosystem, selectors provide precise, elegant user input through clear layout hierarchies, defined touch hit areas, and seamless light/dark theme adaptation.">
                        选择器（Selector）用于收纳与整理大量备选项的信息录入类组件。在卡萨帝高端家电交互体系中，选择器通过清晰的层次结构、明确的触摸热区以及深浅双色模式的无缝适配，保障全场景下的快速精准选择。
                    </p>
                </section>

                <!-- 选择器组件动态渲染节点 -->
                <div id="component_wheel_picker"></div>

            </div>

            <footer class="pt-10 pb-16 text-center text-gray-400 text-sm border-t border-gray-800">
                <p class="font-light" data-i18n-zh="&copy; 2026 Casarte Design Lab. Internal Confidential." data-i18n-en="&copy; 2026 Casarte Design Lab. Internal Confidential.">&copy; 2026 Casarte Design Lab. Internal Confidential.</p>
            </footer>
        </main>
    </div>

    <!-- 载入对应的 JS 内容渲染脚本及导航脚本 -->
    <script src="component_wheel_picker.js"></script>
    <script src="haier-nav.js"></script>
</body>
</html>
