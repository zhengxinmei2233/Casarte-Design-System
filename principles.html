<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-zh="Casarte Design | 1.原则" data-i18n-en="Casarte Design | Principles">Casarte Design | 1.原则</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #0D0D0F;
            --panel-bg: rgba(22, 22, 26, 0.75);
            --border-gray: rgba(255, 255, 255, 0.1);
            --text-gold: #E9BD85;
            --brand-primary: #E9BD85;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-deep);
            color: #F5F5F7;
            overflow-x: hidden;
        }

        /* 极简高级微光背景 */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 0%, #1E1812 0%, #0D0D0F 70%);
        }

        /* 统一的高级灰色外框面板 */
        .gallery-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-gray);
            border-radius: 0;
        }

        /* 基础子卡片悬浮样式 */
        .sub-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0;
            transition: all 0.3s ease;
        }
        .sub-card:hover {
            border-color: var(--text-gold);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(233, 189, 133, 0.15);
        }

        .module-num {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            letter-spacing: -0.05em;
        }

        /* 隐藏原生滚动条，美化 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #2A2A30; border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-gold); }
    </style>
</head>

<body class="antialiased">
    <div class="ambient-bg"></div>

    <!-- 移动端 Header -->
    <header class="md:hidden gallery-panel rounded-none fixed top-0 w-full z-50 p-4 flex justify-between items-center border-b border-amber-900/30">
        <div class="flex items-center">
            <div class="w-8 h-8 mr-2 bg-[#E9BD85] text-black flex items-center justify-center font-bold text-sm">C</div>
            <h1 class="font-bold text-base text-white tracking-widest" data-i18n-zh="原则规范" data-i18n-en="Principles">原则规范</h1>
        </div>
        <button id="mobile-menu-btn" class="p-2 bg-white/5 hover:bg-white/10 rounded-lg text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </header>

    <div class="flex h-screen pt-16 md:pt-0">
        <!-- 侧边栏导航 -->
        <aside id="sidebar" class="hidden md:flex flex-col w-72 h-full fixed top-0 left-0 gallery-panel rounded-none border-r border-gray-800 z-40 overflow-y-auto" aria-label="Casarte Design 设计规范导航" aria-hidden="true"></aside>
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-30 hidden md:hidden" aria-hidden="true"></div>

        <!-- 主内容区 -->
        <main class="flex-1 md:ml-72 p-6 md:p-12 lg:p-16 overflow-y-auto h-full scroll-smooth" id="main-content">
            <div class="max-w-[1360px] mx-auto pb-32 space-y-16">
                
                <!-- 头部：返回主页按钮（与材质页保持 100% 一致的结构和外边距） -->
                <div class="hidden md:flex items-center mb-8">
                    <a href="haier_os_design_system.html" class="px-5 py-2.5 bg-white/15 hover:bg-white/25 transition-colors flex items-center text-white border border-white/20 rounded-full">
                        <span class="text-sm font-medium tracking-wide" data-i18n-zh="返回主页" data-i18n-en="Home">返回主页</span>
                    </a>
                </div>

                <!-- 大标题区 -->
                <section class="border-b border-gray-800 pb-8">
                    <h1 class="text-4xl md:text-6xl font-bold tracking-tight text-white mb-6" data-i18n-zh="1.原则" data-i18n-en="1. Principles">1.原则</h1>
                    <p class="text-base md:text-lg text-gray-300 max-w-4xl leading-relaxed" data-i18n-zh="卡萨帝设计原则作为所有体验裁决与视觉争议的最高决策依据，指引我们在高端艺术与智慧科技之间寻求完美平衡。" data-i18n-en="Casarte design principles serve as the supreme decision-making basis for all experience adjudication and visual disputes, guiding us to seek a perfect balance between high-end art and smart technology.">
                        卡萨帝设计原则作为所有体验裁决与视觉争议的最高决策依据，指引我们在高端艺术与智慧科技之间寻求完美平衡[cite: 14]。
                    </p>
                </section>

                <!-- 原则概览卡片 -->
                <div id="principles-overview" class="gallery-panel p-8 md:p-10 space-y-6">
                    <h3 class="text-2xl font-bold text-white mb-2" data-i18n-zh="1.1 原则概览" data-i18n-en="1.1 Principles Overview">1.1 原则概览</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <a href="brand.html" class="sub-card p-6 block relative group">
                            <div class="flex justify-between items-start mb-3">
                                <h4 class="font-bold text-white group-hover:text-[#E9BD85] transition-colors text-base" data-i18n-zh="1.1 品牌" data-i18n-en="1.1 Brand">1.1 品牌</h4>
                                <svg class="w-4 h-4 text-gray-400 group-hover:text-[#E9BD85] transition-colors mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </div>
                            <p class="text-xs text-gray-400 group-hover:text-gray-300 transition-colors leading-relaxed" data-i18n-zh="卡萨帝品牌体验核心价值、艺术定位与视觉基因。" data-i18n-en="Casarte brand experience core values, artistic positioning, and visual DNA.">卡萨帝品牌体验核心价值、艺术定位与视觉基因[cite: 14]。</p>
                        </a>

                        <a href="design_principles.html" class="sub-card p-6 block relative group">
                            <div class="flex justify-between items-start mb-3">
                                <h4 class="font-bold text-white group-hover:text-[#E9BD85] transition-colors text-base" data-i18n-zh="1.2 设计体验原则" data-i18n-en="1.2 User Experience Principles">1.2 设计体验原则</h4>
                                <svg class="w-4 h-4 text-gray-400 group-hover:text-[#E9BD85] transition-colors mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </div>
                            <p class="text-xs text-gray-400 group-hover:text-gray-300 transition-colors leading-relaxed" data-i18n-zh="指导 UI/UX 决策的核心法则，包含隐形服务与软硬一体交互。" data-i18n-en="Core rules guiding UI/UX decisions, including invisible service and hardware-software integration.">指导 UI/UX 决策的核心法则，包含隐形服务与软硬一体交互[cite: 5, 14]。</p>
                        </a>
                    </div>
                </div>

            </div>

            <footer class="pt-12 pb-20 text-center text-gray-400 text-sm border-t border-gray-800">
                <p class="font-light" data-i18n-zh="&copy; 2026 Casarte Design Lab. Internal Confidential." data-i18n-en="&copy; 2026 Casarte Design Lab. Internal Confidential.">&copy; 2026 Casarte Design Lab. Internal Confidential[cite: 5, 14].</p>
            </footer>
        </main>
    </div>

    <!-- 导入导航与全局多语言脚本 -->
    <script src="haier-nav.js"></script>
</body>
</html>
